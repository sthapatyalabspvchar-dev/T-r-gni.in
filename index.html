        kn: 'ಈ ವರದಿ ನಿಮ್ಮ ಮನೆ, ಅಂಗಡಿ ಅಥವಾ ನಿವೇಶನವನ್ನು ವಾಸ್ತು ತತ್ವಗಳ ಪ್ರಕಾರ ಪರಿಶೀಲಿಸುತ್ತದೆ. ಪ್ರತಿ ಕೋಣೆ ಮತ್ತು ಭಾಗದ ದಿಕ್ಕು ಮತ್ತು ಸ್ಥಾನವನ್ನು ನೋಡಿ, ಈಗಾಗಲೇ ಸರಿಯಾಗಿರುವುದು ಯಾವುದು ಮತ್ತು ತಿದ್ದಬೇಕಾದದ್ದು ಯಾವುದು ಎಂದು ತೋರಿಸುತ್ತದೆ, ಹಾಗೂ ಗೋಡೆ ಒಡೆಯದೆ ಮಾಡಬಹುದಾದ ಪರಿಹಾರಗಳನ್ನು ಸೂಚಿಸುತ್ತದೆ.'

        kn: 'ಸರಳ ನಕ್ಷೆ ಅಥವಾ ಸ್ಕೆಚ್, ಮುಖ್ಯ ಬಾಗಿಲು ಯಾವ ದಿಕ್ಕಿಗೆ ಇದೆ, ಮತ್ತು ಆ ಸ್ಥಳದ ಬಗ್ಗೆ ನಿಮ್ಮ ಚಿಂತೆ ಏನು.'

  };
  var ORDER = ['sampurna', 'vivaha', 'karma', 'graha', 'varsha', 'vastu'];

  var card = document.getElementById('card');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank() {
    var score = {};
    ORDER.forEach(function (k) { score[k] = 0; });
    picks.forEach(function (oi, qi) {
      var s = QUESTIONS[qi].opts[oi].s;
      Object.keys(s).forEach(function (k) { score[k] += s[k]; });
    });
    return ORDER.slice().sort(function (a, b) { return score[b] - score[a]; });
  }

  function waLink(reportKey) {
    var text = UI.msg[lang](REPORTS[reportKey].name, custName.trim());
    return { text: text, url: 'https://wa.me/' + ORDER_WHATSAPP_NUMBER + '?text=' + encodeURIComponent(text) };
  }

  function renderQuestion() {
    var q = QUESTIONS[step];
    var bars = QUESTIONS.map(function (_, i) { return '<i class="' + (i <= step ? 'on' : '') + '"></i>'; }).join('');
    var opts = q.opts.map(function (o, i) {
      return '<button type="button" class="opt" data-i="' + i + '">' + esc(o.t[lang]) + '</button>';
    }).join('');
    card.innerHTML =
      '<div class="progress" aria-hidden="true">' + bars + '</div>' +
      '<p class="step">' + UI.q[lang] + ' ' + (step + 1) + ' ' + UI.of[lang] + ' ' + QUESTIONS.length + '</p>' +
      '<h2>' + esc(q.q[lang]) + '</h2>' +
      '<div class="opts">' + opts + '</div>' +
      '<div class="nav">' + (step > 0 ? '<button type="button" class="link" id="back">' + UI.back[lang] + '</button>' : '<span></span>') + '</div>';
    card.querySelectorAll('.opt').forEach(function (b) {
      b.addEventListener('click', function () {
        picks[step] = Number(b.getAttribute('data-i'));
        step += 1;
        render();
        window.scrollTo(0, 0);
      });
    });
    var back = document.getElementById('back');
    if (back) back.addEventListener('click', function () { step -= 1; picks.length = step; render(); });
  }

  function list(items) {
    return '<ul class="list">' + items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
  }

  function renderResult() {
    var order = rank();
    var top = REPORTS[order[0]];
    var alt = REPORTS[order[1]];
    var chips = picks.map(function (oi, qi) { return '<span class="chip">' + esc(QUESTIONS[qi].opts[oi].t[lang]) + '</span>'; }).join('');
    card.innerHTML =
      '<span class="badge">' + UI.best[lang] + '</span>' +
      '<h2 class="rname">' + esc(top.name) + '</h2>' +
      '<p class="rsub">' + esc(top.sub[lang]) + '</p>' +
      '<p class="rdesc">' + esc(top.long[lang]) + '</p>' +
      '<div class="sec"><h3>' + UI.told[lang] + '</h3><div class="chips">' + chips + '</div></div>' +
      '<div class="sec"><h3>' + UI.inside[lang] + '</h3>' + list(top.inside[lang]) + '</div>' +
      '<div class="sec"><h3>' + UI.bestFor[lang] + '</h3><p>' + esc(top.best[lang]) + '</p></div>' +
      '<div class="sec"><h3>' + UI.need[lang] + '</h3><p>' + esc(top.need[lang]) + '</p></div>' +
      '<div class="sec"><h3>' + UI.how[lang] + '</h3><ol class="steps">' + UI.steps[lang].map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol><p class="note">' + UI.disclaimer[lang] + '</p></div>' +
      '<div class="sec also"><h3>' + UI.also[lang] + '</h3>' +
        '<span class="nm">' + esc(alt.name) + ' <span style="color:var(--muted);font-weight:500">· ' + esc(alt.sub[lang]) + '</span></span>' +
        '<span class="ds">' + esc(alt.desc[lang]) + '</span></div>' +
      '<div class="order">' +
        '<label for="cname">' + UI.nameLbl[lang] + '</label>' +
        '<input type="text" id="cname" autocomplete="given-name" value="' + esc(custName) + '">' +
        '<div class="btns">' +
          '<a class="cta" id="wa" href="#" target="_blank" rel="noopener">' + UI.order[lang] + '</a>' +
          '<button type="button" class="ghost" id="copy">' + UI.copy[lang] + '</button>' +
        '</div>' +
        '<p class="note">' + UI.privacy[lang] + '</p>' +
      '</div>' +
      '<div class="site"><h3>' + UI.siteH[lang] + '</h3>' +
        '<div class="browser"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">taragniin.vercel.app</span></div>' +
        '<div class="shot"><span class="wm">TĀRĀGNI</span><p class="tag">' + UI.siteTag[lang] + '</p><p class="quote">' + UI.siteQuote[lang] + '</p>' +
        '<div class="secs">' + UI.siteSecs[lang].map(function (s) { return '<span>' + esc(s) + '</span>'; }).join('') + '</div></div></div>' +
        '<a class="cta" href="https://taragniin.vercel.app" target="_blank" rel="noopener">' + UI.siteCta[lang] + '</a>' +
        '<p class="note">' + UI.siteNote[lang] + '</p></div>' +
      '<div class="nav"><button type="button" class="link" id="again">' + UI.again[lang] + '</button></div>';

    var wa = document.getElementById('wa');
    var input = document.getElementById('cname');
    function sync() { custName = input.value; wa.setAttribute('href', waLink(order[0]).url); }
    input.addEventListener('input', sync);
    sync();

    document.getElementById('copy').addEventListener('click', function () {
      var btn = this;
      var text = waLink(order[0]).text;
      function done() { btn.textContent = UI.copied[lang]; setTimeout(function () { btn.textContent = UI.copy[lang]; }, 1600); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else { fallback(); }
    });
    document.getElementById('again').addEventListener('click', function () { step = 0; picks = []; render(); window.scrollTo(0, 0); });
  }

  function render() {
    document.documentElement.lang = lang;
    document.getElementById('title').innerHTML = UI.title[lang];
    document.getElementById('intro').innerHTML = UI.intro[lang];
    document.getElementById('foot').textContent = UI.foot[lang];
    document.querySelectorAll('.langs button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    if (step < QUESTIONS.length) renderQuestion(); else renderResult();
  }

  document.querySelectorAll('.langs button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); render(); });
  });

  render();
</script>
</html>
